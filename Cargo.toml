[package]
name = "sideband"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts"] }
moq-nvenc = "0.0.3"
rand = "0.10.2"
rtc = "0.20.4"
rusty-opus = "0.9.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
webrtc = "0.20.4"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_KernelStreaming", "Win32_System_Console", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
windows-core = "0.62.2"

[build-dependencies]
winresource = "0.1.31"
